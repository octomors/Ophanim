<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ophanim: client prototype</title>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f5f7;--pn:#fff;--ink:#1b1f27;--mut:#6b7280;--ln:#dfe2e8;--ac:#2f6fed;--gap:#e7e9ee;box-sizing:border-box;height:100%;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#14161b;--pn:#1c1f26;--ink:#e8eaf0;--mut:#8b93a3;--ln:#2c303a;--ac:#6c9bff;--gap:#262a33}}
:root[data-theme=dark]{--bg:#14161b;--pn:#1c1f26;--ink:#e8eaf0;--mut:#8b93a3;--ln:#2c303a;--ac:#6c9bff;--gap:#262a33}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;overflow:hidden;display:flex;flex-direction:column;background:var(--bg);color:var(--ink);font:14px/1.4 Onest,system-ui,sans-serif}

header .sp{flex:1}
button,select,input{font:inherit;color:var(--ink);background:var(--pn);border:1px solid var(--ln);border-radius:6px;padding:4px 9px}
button{cursor:pointer}button:hover{border-color:var(--ac)}:focus-visible{outline:2px solid var(--ac)}
.wrap{flex:1;min-height:0;display:grid;grid-template-columns:260px 1fr;grid-template-rows:minmax(0,1fr)}
#sort{flex:1;min-width:0}#rsel{align-items:center}#rsel select{flex:none}#rsel span{font-size:12px}
.selbtns button{flex:1}.wrap.appv .selbtns{display:none}
.row.dro{box-shadow:inset 0 0 0 1.5px var(--ac);background:var(--bg)}.chev{cursor:pointer;width:16px;text-align:center;color:var(--mut);flex:none}.fi{flex:none}.row.folder .n{cursor:pointer;font-weight:500}.ren{flex:1;min-width:0;padding:1px 4px}.row input:disabled{opacity:.45}
.selbtns button{display:flex;align-items:center;justify-content:center;gap:5px;font-size:12px;padding:4px 6px}
#total{color:var(--mut);font-size:12px;padding-top:6px;border-top:1px solid var(--ln)}
.row{border-radius:6px}.row.sel{box-shadow:inset 0 0 0 1.5px var(--ac)}
.app3{display:grid;grid-template-columns:300px max-content minmax(420px,1fr);gap:10px;flex:1;min-height:0}
.c1{display:flex;flex-direction:column;gap:10px;align-items:flex-start;min-height:0}.c1 .r2{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%}
.c2{display:flex;flex-direction:column;gap:10px;min-height:0}.c3{overflow:auto}
.wrap.noside{grid-template-columns:1fr}.wrap.noside aside{display:none}
aside{border-right:1px solid var(--ln);background:var(--pn);padding:10px;display:flex;flex-direction:column;gap:8px;min-height:0}

#list{overflow:auto;flex:1;min-height:0}
.row{display:flex;align-items:center;gap:8px;padding:4px}.row:hover{background:var(--bg)}
.dot{width:10px;height:10px;border-radius:50%;flex:none;display:inline-block}
.row .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer}
.v,.mut{color:var(--mut)}.v{font-size:12px}
main{padding:12px 14px;min-width:0;min-height:0;display:flex;flex-direction:column;gap:10px;overflow:hidden}
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.bar h2{margin:0;font-size:18px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.t{background:var(--pn);border:1px solid var(--ln);border-radius:8px;padding:8px 12px}
.t small{color:var(--mut);display:block}.t b{font-size:18px;font-weight:600}
.t[data-d]{cursor:pointer}.t[data-d]:hover{border-color:var(--ac)}
.card{background:var(--pn);border:1px solid var(--ln);border-radius:8px;padding:12px;min-height:0;position:relative}
#ch,#dc{flex:1;overflow:hidden}
.mid{display:flex;gap:10px;flex:1;min-height:0}
.ok{color:#2a9d5b}
svg text{fill:var(--mut);font:10px Onest,system-ui,sans-serif}svg [data-d],svg [data-a]{cursor:pointer}
.legend{display:grid;gap:4px;overflow:auto}.legend div{display:flex;gap:8px;align-items:center;cursor:pointer}
.flex{display:flex;gap:20px;align-items:center}
.empty{max-width:520px;margin:8vh auto;text-align:center;border:2px dashed var(--ln);border-radius:12px;padding:32px}
.empty button{margin:4px}
.tl{display:flex;overflow-y:auto;height:100%}.tl .lb{width:140px;flex:none}.tl .lb div{height:26px;line-height:26px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tl .sc{overflow-x:auto;overflow-y:hidden;flex:1}
#tp{position:fixed;display:none;pointer-events:none;background:var(--ink);color:var(--bg);padding:5px 8px;border-radius:6px;font-size:12px;z-index:9;max-width:320px}
</style></head><body>
<header><b>Ophanim</b><span class="sp"></span>
<button data-act="folder">Log folder</button><button data-act="files">Files</button><button data-act="demo">Demo</button>
<input id="fd" type="file" webkitdirectory hidden><input id="ff" type="file" multiple hidden></header>
<div class="wrap"><aside>
<div class="ctl" id="rsel"></div>
<input id="q" type="search" placeholder="Search apps">
<div class="ctl"><select id="sort"><option value="sec">By time</option><option value="first">By first seen</option><option value="md">Max per day</option><option value="avg">Average per day</option><option value="l">By launches</option><option value="name">By name</option></select><button data-act="dir" title="Direction">↓</button></div>
<div class="ctl selbtns"><button data-act="selapps" title="Check or uncheck all apps with an active checkbox">Select All Apps</button><button data-act="selfold" title="Turn all folders on or off">Select All <svg width="14" height="12" viewBox="0 0 14 12"><path d="M0 1.5A1.5 1.5 0 0 1 1.5 0H5l1.5 2H12.5A1.5 1.5 0 0 1 14 3.5v7A1.5 1.5 0 0 1 12.5 12h-11A1.5 1.5 0 0 1 0 10.5z" fill="currentColor"/></svg></button></div>
<div id="list"></div><div id="total"></div></aside><main id="main"></main></div>
<div id="tp"></div>
<script>
const $=s=>document.querySelector(s),D=86400,esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const S={segs:[],apps:new Map(),ses:[],launch:[],bad:0,last:'',range:30,view:'heat',sort:'sec',dir:-1,q:'',scr:'main',day:null,app:null,zero:false,zoom:1};
S.folders=[];S.fid=1;S.ren=null;S.drag=null;
try{const j=JSON.parse(localStorage.getItem('ophanim.folders')||'null');if(j){S.folders=j.f||[];S.fid=j.n||1}}catch{}
const saveF=()=>{try{localStorage.setItem('ophanim.folders',JSON.stringify({f:S.folders,n:S.fid}))}catch{}};
const fk=f=>'f:'+f.id,fol=e=>S.folders.find(f=>f.items.includes(e)),ent=e=>{const f=fol(e);return f&&f.on?fk(f):e};
const fc=id=>`hsl(${Math.round(id*137.508)%360} 65% 50%)`;
function syncF(){for(const k of[...S.apps.keys()])if(k.startsWith('f:'))S.apps.delete(k);for(const f of S.folders){f.color=fc(f.id);const fs=f.items.map(x=>S.apps.get(x)).filter(Boolean);S.apps.set(fk(f),{exe:fk(f),name:f.name,color:f.color,show:true,folder:true,first:fs.length?Math.min(...fs.map(x=>x.first)):0})}}
function chgF(){S.folders=S.folders.filter(f=>f.items.length);syncF();saveF();rMain()}
const tip=s=>`data-tip="${esc(s)}"`,P2=n=>String(n).padStart(2,'0');
const MO=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'],WD=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const pt=t=>{const m=/(\d+)-(\d+)-(\d+)T(\d+):(\d+):(\d+)/.exec(t||'');return m?Date.UTC(+m[1],m[2]-1,+m[3],+m[4],+m[5],+m[6])/1e3:NaN};
const dk=L=>new Date(L*1e3).toISOString().slice(0,10),add=(k,n)=>dk(Date.parse(k)/1e3+n*D);
const fd=k=>k.slice(8,10)+'.'+k.slice(5,7)+'.'+k.slice(2,4),fdm=k=>k.slice(8,10)+'.'+k.slice(5,7),dow=k=>new Date(k+'T00:00:00Z').getUTCDay();
const fmt=s=>{s=Math.round(s);const h=Math.floor(s/3600),m=Math.floor(s%3600/60);return h?h+'h '+P2(m)+'m':m?m+'m':s+'s'};
const col=n=>{let h=0;for(const c of n)h=(h*31+c.charCodeAt(0))>>>0;return`hsl(${h%360} 58% 52%)`};
function load(texts){const ev=[];let bad=0;for(const t of texts)for(const l of t.split('\n')){if(!l.trim())continue;try{const o=JSON.parse(l);o.L=pt(o.time);if(isNaN(o.L))throw 0;ev.push(o)}catch{bad++}}
ev.sort((a,b)=>a.L-b.L);const segs=[],apps=new Map(),ses=[],launch=[];let cur=null,last=0,so=null;
const close=e=>{if(!cur)return;for(let t=cur.s0;t<e;){const d=Math.floor(t/D)*D,en=Math.min(e,d+D);segs.push({day:dk(t),s:t-d,e:en-d,exe:cur.exe,title:cur.title});t=en}cur=null};
for(const o of ev){const x=(o.exe_name||'').toLowerCase();
if(x){let a=apps.get(x);if(!a)apps.set(x,a={exe:x,name:o.friendly_name||x,color:col(x),show:true,first:o.L});else if(o.friendly_name)a.name=o.friendly_name}
if(o.event_type=='focus_changed'&&x){close(o.L);cur={exe:x,title:o.window_title||'',s0:o.L}}
else if(o.event_type=='logout'){close(o.L);if(so!=null){ses.push([so,o.L]);so=null}}
else if(o.event_type=='logon'){close(last);if(so!=null)ses.push([so,last]);so=o.L}
else if(o.event_type=='process_start'&&x)launch.push([dk(o.L),x]);
last=o.L}
close(last);if(so!=null)ses.push([so,last]);
const old=S.apps;apps.forEach((a,k)=>{if(old.has(k))a.show=old.get(k).show});
Object.assign(S,{segs,apps,ses,launch,bad,last:ev.length?ev[ev.length-1].time:'',scr:'main'});syncF();
S.end=segs.length?segs[segs.length-1].day:null;S.min=segs.length?segs[0].day:null;render()}
function rangeSel(){return`<select data-k="range" aria-label="Time span">${[[7,'Last 7 days'],[30,'Last 30 days'],[90,'Last 90 days'],[180,'Last 180 days'],[365,'Last 365 days'],[0,'All time']].map(([v,l])=>`<option value="${v}" ${S.range==v?'selected':''}>${l}</option>`).join('')}</select>`}
function rng(){const e=S.end,s=S.range?add(e,-(S.range-1)):S.min,l=[];for(let d=s;d<=e;d=add(d,1))l.push(d);return{s,e,l}}
function stats(){const R=S.scr=='day'?{s:S.day,e:S.day}:rng(),a=new Map(),g=k=>{let x=a.get(k);if(!x)a.set(k,x={sec:0,days:new Map(),max:0,l:0});return x};
for(const s of S.segs){if(s.day<R.s||s.day>R.e)continue;const x=g(s.exe),d=s.e-s.s;x.sec+=d;x.days.set(s.day,(x.days.get(s.day)||0)+d);x.max=Math.max(x.max,d)}
for(const[d,e]of S.launch)if(d>=R.s&&d<=R.e&&a.has(e))a.get(e).l++;
for(const f of S.folders){const xs=f.items.map(i=>a.get(i)).filter(Boolean);if(!xs.length)continue;const x={sec:0,days:new Map(),max:0,l:0};for(const y of xs){x.sec+=y.sec;x.l+=y.l;x.max=Math.max(x.max,y.max);y.days.forEach((v,d)=>x.days.set(d,(x.days.get(d)||0)+v))}a.set(fk(f),x)}
for(const[k,x]of a){const ap=S.apps.get(k);x.first=ap.first;x.md=Math.max(...x.days.values());x.avg=x.sec/x.days.size;x.name=ap.name.toLowerCase()}return a}
const shown=e=>S.apps.get(e).show;
const mtc=k=>{const q=S.q.toLowerCase();return !q||S.apps.get(k).name.toLowerCase().includes(q)||k.includes(q)};
const FI=c=>`<svg class="fi" width="14" height="12" viewBox="0 0 14 12"><path d="M0 1.5A1.5 1.5 0 0 1 1.5 0H5l1.5 2H12.5A1.5 1.5 0 0 1 14 3.5v7A1.5 1.5 0 0 1 12.5 12h-11A1.5 1.5 0 0 1 0 10.5z" fill="${c}"/></svg>`;
function rList(){const L=$('#list'),top=L.scrollTop;
if(!S.segs.length){$('#rsel').innerHTML='';L.innerHTML='';$('#total').textContent='';return}
$('#rsel').innerHTML=S.scr=='day'?`<button data-act="prev">◀</button><b style="flex:1;text-align:center">${fd(S.day)}, ${WD[dow(S.day)]}</b><button data-act="next">▶</button>`:rangeSel()+`<span class="mut">${fd(rng().s)} – ${fd(S.end)}</span>`;
const st=stats(),q=S.q.toLowerCase(),ap=S.scr=='app';
const cmp=(a,b)=>S.sort=='name'?S.dir*a[1].name.localeCompare(b[1].name):S.dir*(a[1][S.sort]-b[1][S.sort]);
const v=x=>({sec:fmt(x.sec),first:fd(dk(x.first)),md:fmt(x.md),avg:fmt(x.avg),l:x.l+' runs',name:fmt(x.sec)}[S.sort]);
const items=[],inF=new Set();
for(const f of S.folders){f.items.forEach(i=>inF.add(i));if(!st.has(fk(f)))continue;const fn=f.name.toLowerCase().includes(q),mem=f.items.filter(i=>st.has(i)&&(!q||fn||mtc(i)));if(q&&!fn&&!mem.length)continue;mem.sort((a,b)=>cmp([a,st.get(a)],[b,st.get(b)]));items.push([fk(f),st.get(fk(f)),f,mem])}
for(const[k,x]of st){if(k.startsWith('f:')||inF.has(k)||!mtc(k))continue;items.push([k,x,null,[]])}
items.sort(cmp);
const arow=(k,x,f)=>{const a=S.apps.get(k),dim=f&&f.on;return`<div class="row${ap&&k==S.app?' sel':''}" draggable="true" data-ap="${esc(k)}" ${f?'style="padding-left:26px"':''}>${ap?'':`<input type="checkbox" ${dim?'checked disabled':`data-chk="${esc(k)}" ${a.show?'checked':''}`} title="Include in stats">`}<span class="dot" style="background:${a.color}"></span><span class="n" data-a="${esc(k)}" title="${esc(k)}">${esc(a.name)}</span><span class="v">${v(x)}</span></div>`};
const frow=(f,x)=>`<div class="row folder${ap&&S.app==fk(f)?' sel':''}" data-fr="${f.id}">${ap?'':`<input type="checkbox" data-fchk="${f.id}" ${f.on?'checked':''} title="Merge into one entry and include in stats">`}${FI(f.color)}${S.ren==f.id?`<input class="ren" data-ren="${f.id}" value="${esc(f.name)}">`:`<span class="n" data-fn="${f.id}" title="Double-click to rename">${esc(f.name)}</span>`}<span class="v">${v(x)}</span><span class="chev" data-fo="${f.id}">${f.open?'▾':'▸'}</span></div>`;
L.innerHTML=items.map(([k,x,f,mem])=>f?frow(f,x)+((f.open||q)?mem.map(m=>arow(m,st.get(m),f)).join(''):''):arow(k,x,null)).join('')||'<div class="mut">No apps</div>';
L.scrollTop=top;const rn=L.querySelector('.ren');if(rn){rn.focus();rn.select()}
$('#total').textContent='Total: '+[...st.keys()].filter(k=>!k.startsWith('f:')).length+' apps'}
function rawOf(e,R){const f=e.startsWith('f:')&&S.folders.find(x=>fk(x)==e),it=f?f.items:[e];return S.segs.filter(s=>s.day>=R.s&&s.day<=R.e&&it.includes(s.exe))}
function segsOf(e,R){const r=rawOf(e,R);if(!e.startsWith('f:'))return r;const o=[];for(const s of r){const p=o[o.length-1];if(p&&p.day==s.day&&p.e==s.s)p.e=s.e;else o.push({day:s.day,s:s.s,e:s.e,exe:e,title:s.title})}return o}
const hm=s=>P2(Math.floor(s/3600))+':'+P2(Math.floor(s%3600/60));
function vis(days){const set=new Set(days),o=[];for(const s of S.segs){if(!set.has(s.day))continue;const k=ent(s.exe);if(!S.apps.get(k).show)continue;const p=o[o.length-1];if(k[0]=='f'&&k[1]==':'&&p&&p.exe==k&&p.day==s.day&&p.e==s.s)p.e=s.e;else o.push({day:s.day,s:s.s,e:s.e,exe:k,title:s.title})}return o}
function clusters(list){const out=[];let c=null;const fl=()=>{if(c)out.push(c);c=null};
for(const g of list){const sh=g.e-g.s<1800;if(sh&&c&&c.sh&&g.s-c.e<=120&&c.e-c.s<1800){c.items.push(g);c.e=g.e}else{fl();c={s:g.s,e:g.e,items:[g],sh};if(!sh)fl()}}fl();return out}
const OFFP='<pattern id="off" patternUnits="userSpaceOnUse" width="6" height="6" patternTransform="rotate(45)"><rect width="6" height="6" fill="var(--gap)"/><rect width="1.5" height="6" fill="var(--mut)" fill-opacity=".45"/></pattern>';
let _o,_s;function offs(){if(_s!==S.ses){_s=S.ses;_o=[];for(let i=1;i<S.ses.length;i++)if(S.ses[i][0]>S.ses[i-1][1])_o.push([S.ses[i-1][1],S.ses[i][0]])}return _o}
function offRects(d,x,w,Y){const d0=Date.parse(d)/1e3;let o='';for(const[a,b]of offs()){const s=Math.max(a,d0)-d0,e=Math.min(b,d0+D)-d0;if(e>s)o+=`<rect data-d="${d}" ${tip('PC off · '+fmt(e-s))} x="${x}" y="${Y(e)}" width="${w}" height="${Y(s)-Y(e)}" fill="url(#off)"/>`}return o}
function heat(R,W,H){const x0=44,pt=10,pb=20,hh=H-pt-pb,n=R.l.length,cw=(W-x0)/n,Y=s=>pt+hh-s/D*hh,defs=new Map();let o='';
for(let h=0;h<=24;h++){const y=Y(h*3600);o+=`<line x1="${x0}" x2="${W}" y1="${y}" y2="${y}" stroke="var(--ln)"/><text x="${x0-6}" y="${y+3}" text-anchor="end">${P2(h)}:00</text>`}
const by=new Map();for(const s of vis(R.l)){if(!by.has(s.day))by.set(s.day,[]);by.get(s.day).push(s)}
R.l.forEach((d,i)=>{o+=offRects(d,x0+i*cw,Math.max(cw-1,1),Y);for(const c of clusters(by.get(d)||[])){const t=new Map();for(const g of c.items)t.set(g.exe,(t.get(g.exe)||0)+g.e-g.s);
const ex=[...t].sort((a,b)=>b[1]-a[1]);let fill;
if(ex.length>1){const k=ex.slice(0,4).map(e=>S.apps.get(e[0]).color).join();if(!defs.has(k))defs.set(k,'p'+defs.size);fill=`url(#${defs.get(k)})`}else fill=S.apps.get(ex[0][0]).color;
const y1=Y(c.e),h=Math.max(Y(c.s)-y1,ex.length>1?3:1.5);
const tx=fd(d)+'\n'+ex.map(([e,v])=>S.apps.get(e).name+': '+fmt(v)).join('\n')+(c.items.length==1&&c.items[0].title?'\n'+c.items[0].title:'');
o+=`<rect data-a="${esc(ex[0][0])}" ${tip(tx)} x="${x0+i*cw}" y="${y1}" width="${Math.max(cw-1,1)}" height="${h}" fill="${fill}"/>`}});
let df=OFFP;for(const[k,id]of defs){const cs=k.split(',');df+=`<pattern id="${id}" patternUnits="userSpaceOnUse" width="${cs.length*3}" height="${cs.length*3}" patternTransform="rotate(45)">${cs.map((c,i)=>`<rect x="${i*3}" width="3" height="${cs.length*3}" fill="${c}"/>`).join('')}</pattern>`}
const st=Math.ceil(n/Math.floor((W-x0)/50));o+=R.l.map((d,i)=>i%st?'':`<text data-d="${d}" x="${x0+i*cw}" y="${H-4}">${fdm(d)}</text>`).join('');
return`<svg width="${W}" height="${H}"><defs>${df}</defs>${o}</svg>`}
function hist(R,W,H){const mo=R.l.length>120,key=d=>mo?d.slice(0,7):d,g=new Map();
for(const s of vis(R.l)){const k=key(s.day);let m=g.get(k);if(!m)g.set(k,m=new Map());m.set(s.exe,(m.get(s.exe)||0)+s.e-s.s)}
const keys=[...new Set(R.l.map(key))],tot=k=>[...(g.get(k)||[]).values()].reduce((a,b)=>a+b,0),top=Math.max(1,Math.ceil(Math.max(0,...keys.map(tot))/3600)),step=Math.ceil(top/Math.floor((H-30)/18)),x0=44,pt=8,pb=20,hh=H-pt-pb,bw=(W-x0)/keys.length,Y=s=>pt+hh-s/(top*3600)*hh;let o='';
